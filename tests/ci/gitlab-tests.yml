stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Use the MR pipeline instead of creating a second branch pipeline.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

mrtini-unit-tests:
  stage: test
  image: python:3.10-bookworm
  interruptible: true
  timeout: 30 minutes
  rules:
    - when: on_success
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    MPLBACKEND: Agg
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  cache:
    key:
      prefix: mrtini-python310-cpu
      files:
        - tests/ci/requirements.txt
    paths:
      - .cache/pip/
  before_script:
    - cc --version
    - python --version
    - |
      if [ -f src/rust_prepass/cargo.toml ]; then
        mv src/rust_prepass/cargo.toml src/rust_prepass/Cargo.toml
      fi
    - test -f src/rust_prepass/Cargo.toml
    - python -m pip install --upgrade pip
    - python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
    - python -m pip install -r tests/ci/requirements.txt
    - python -m pip install PyYAML
    - |
      set -eu
      cd "$CI_PROJECT_DIR"

      python - <<'PY'
      from pathlib import Path
      try:
          import tomllib
      except ModuleNotFoundError:
          import tomli as tomllib

      root = Path.cwd()
      manifest = root / "src/rust_prepass/Cargo.toml"

      assert manifest.is_file(), f"Missing manifest: {manifest}"

      config_path = root / "pyproject.toml"
      content = config_path.read_text()
      with config_path.open("rb") as f:
          configured = tomllib.load(f)["tool"]["maturin"]["manifest-path"]

      old = f'manifest-path = "{configured}"'
      new = f'manifest-path = "{manifest.resolve()}"'

      assert old in content, "Could not locate manifest-path setting"
      config_path.write_text(content.replace(old, new, 1))

      print("Absolute Cargo manifest:", manifest.resolve())
      print("Manifest exists:", manifest.is_file())
      PY

      RUST_LOG=maturin=debug python -m pip install -v -e . --no-deps

    - python -c "import mrtini_prepass_rs; print(mrtini_prepass_rs.__file__)"
    - python scripts/setup_mrtini.py --device cpu --skip-torch --dev
    - python -m pip check
  script:
    - python tests/run_mrtini_tests.py --fail-under 0 --color=no
  # Reads the actual combined statement/branch percentage from pytest-cov.
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - tests/reports/mrtini/
    reports:
      junit: tests/reports/mrtini/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: tests/reports/mrtini/coverage.xml
