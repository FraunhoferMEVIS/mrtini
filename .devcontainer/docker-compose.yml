services:
  mrtini-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        TORCH_VERSION: 2.8.0+cu129
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu129
    working_dir: /workspaces/mrtini
    command: sleep infinity
    volumes:
      - ..:/workspaces/mrtini:cached
      - pip-cache:/root/.cache/pip
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/opt/mrtini-cargo-target
    environment:
      MRTINI_DEVICE: cuda
      PYTHONPATH: /workspaces/mrtini/src:/workspaces/mrtini
      MPLBACKEND: Agg
      GAMMASTAR_RECON_HOST: gammastar-recon
      GAMMASTAR_RECON_PORT: "9002"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: "16gb"
    gpus: all
    depends_on:
      - gammastar-recon

  gammastar-recon:
    build:
      context: ../external/gammaSTAR/sequenceServer/gammastar_recon
      dockerfile: docker/Dockerfile
      target: gs-recon
    image: mrtini-gammastar-recon-dev:local
    ports:
      - "9002:9002"
    restart: unless-stopped

volumes:
  pip-cache:
  cargo-registry:
  cargo-git:
  cargo-target:
